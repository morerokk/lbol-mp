MpResilient:
  Name: 堅韌
  Description: |-
    回合結束時額外失去 {Level} 層|虛弱|、|易傷|和|鎖定|。
    獲得的|失去火力|減少 {Level} 點，但不低於 1 點。
  Brief: 更快的失去|虛弱|、|易傷|和|鎖定|，且獲得的|失去火力|減少。

MpOfferingSe:
  Name: 無主的供奉
  Description: 你接下來打出的 {Level} 張能力牌同時為你的所有|隊友|打出。
  Brief: 你接下來的 {Level} 張能力牌同時為|隊友|打出。

MpPartner:
  Name: 隊友
  Description: 其他玩家。
  Brief: 其他玩家。

MpAnattaSe:
  Name: 無我之境
  Description: "你離開|平靜|時，所有玩家獲得{Mana}。"
  Brief: "你離開|平靜|時，所有玩家獲得{Mana}。"

MpAbilityPileSe:
  Name: 東方能力夜
  Description: 能力牌的費用提升{Mana}。
  Brief: 能力牌的費用提升{Mana}。

MpSelfControlSe:
  Name: 自我圓滿
  Description: |-
    玩家的回合結束時，她處於|熱情|則所有玩家獲得 {Level} 點|火力|；處於|平靜|則所有玩家獲得 {Count} 點|格擋|。
  Brief: |-
    玩家的回合結束時，她處於|熱情|則所有玩家獲得 {Level} 點|火力|；處於|平靜|則所有玩家獲得 {Count} 點|格擋|。

MpFrontalDefenseTalismanSe:
  Name: 前線防禦護身符
  Description: |-
    妳從卡牌獲得|護盾|時，
    所有|隊友|獲得一半的|格擋|。
  Brief: |-
    妳從卡牌獲得|護盾|時，所有|隊友|獲得一半的|格擋|。

MpScaled:
  Name: 背負
  Description: 費用每有一名|隊友|增加一次。
  Brief: 費用每有一名|隊友|增加一次。

MpCatalystSe:
  Name: 催化劑
  Description: |-
    每當{PlayerName}增加一張|不穩定魔藥|，將一張|不穩定魔藥|洗入一名隨機|隊友|的抽牌堆 {Level} 次。
  Brief: |-
    每當{PlayerName}增加一張|不穩定魔藥|，將一張|不穩定魔藥|洗入一名隨機|隊友|的抽牌堆。

MpSharedTechniqueSe:
  Name: 共享策略
  Description: |-
    這回合內，下 {Level} 張打出的攻擊牌也將被所有|隊友|打出。
  Brief: |-
    這回合內，下若干張打出的攻擊牌也將被所有|隊友|打出。

MpInspiredBondsSe:
  Name: 受啟發的羈絆
  Description: |-
    使用|同伴|的|a:主動技能|或|u:終結技|時，所有|隊友|手中的隨機一張|同伴|獲得 {Level} 點|支援度|。
  Brief: |-
    使用|同伴|的|a:主動技能|或|u:終結技|時，所有|隊友|手中的隨機一張|同伴|獲得若干點|支援度|。

MpDeepFreezeSe:
  Name: 深度凍結
  Description: |-
    每當{PlayerName}對擁有|寒冷|的敵人施加|寒冷|，施加 {Level} 回合的|易傷|。
  Brief: |-
    每當{PlayerName}對擁有|寒冷|的敵人施加|寒冷|，施加若干回合的|易傷|。

MpIceShardsSe:
  Name: 冰屑
  Description: |-
    任何玩家對擁有|寒冷|的敵人造成攻擊傷害時，她獲得 {Level} 層|寒冰甲|。
  Brief: |-
    任何玩家對擁有|寒冷|的敵人造成攻擊傷害時，她獲得若干層|寒冰甲|。
