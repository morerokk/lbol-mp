# Note: "Partner" is as in "Partner" from Imperishable Night.
# This refers to other players in multiplayer.

MpResilient:
  Name: Resilient
  Description: |-
    At the end of its turn, loses {Level} more |Weak|, |Vulnerable|, and |Lock On|.
    Gains {Level} less |Firepower Down|, to a minimum of 1.
  Brief: Loses |Weak|, |Vulnerable| and |Lock On| faster, and takes less |Firepower Down|.

MpOfferingSe:
  Name: Offering to the Ownerless
  Description: |-
    The next {Level:plural one='Ability card' other='% Ability cards'} you play will also be played for all your |Partners|.
  Brief: |-
    Your next {Level:plural one='Ability card' other='% Ability cards'} will also be played for your |Partners|.

MpAnattaSe:
  Name: Anatta
  Description: Whenever you exit |Serenity|, all players gain {Mana}.
  Brief: Exiting |Serenity| gives every player {Mana}.

MpAbilityPileSe:
  Name: Ability Pile
  Description: Ability cards cost {Mana} more.
  Brief: Ability cards cost {Mana} more.

MpSelfControlSe:
  Name: Self-Fulfillment
  Description: |-
    At the end of the player's turn, all players gain {Level} |Firepower| if she's in |Passion|, or {Count} |Block| if she's in |Serenity|.
  Brief: |-
    At the end of your turn, all players gain {Level} |Firepower| in |Passion|, or {Count} |Block| in |Serenity|.

MpPartner:
  Name: Partner
  Description: Other players.
  Brief: Other players.

MpFrontalDefenseTalismanSe:
  Name: Frontal Defense Talisman
  Description: |-
    Whenever you gain |Barrier| from a card,
    all |Partners| gain half that much |Block|.
  Brief: |-
    |Barrier| you gain from cards also gives all |Partners| half that much |Block|.
