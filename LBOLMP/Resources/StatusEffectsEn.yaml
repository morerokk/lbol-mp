# Note: "Partner" is as in "Partner" from Imperishable Night.
# This refers to other players in multiplayer.

MpResilient:
  Name: Resilient
  Description: |-
    At the end of its turn, loses {Level} more |Weak|, |Vulnerable|, and |Lock On|.
    Gains {Level} less |Firepower Down|, to a minimum of 1.
  Brief: Loses |Weak|, |Vulnerable| and |Lock On| faster, and takes less |Firepower Down|.

MpOfferingSe:
  Name: Offering to the Ownerless
  Description: |-
    The next {Level:plural one='Ability card' other='% Ability cards'} played will also be played for all your |Partners|.
  Brief: |-
    Your next {Level:plural one='Ability card' other='% Ability cards'} will also be played for your |Partners|.

MpAnattaSe:
  Name: Anatta
  Description: Whenever you exit |Serenity|, all players gain {Mana}.
  Brief: Exiting |Serenity| gives every player {Mana}.

MpAbilityPileSe:
  Name: Ability Pile
  Description: Ability cards cost {Mana} more.
  Brief: Ability cards cost {Mana} more.

MpSelfControlSe:
  Name: Self-Fulfillment
  Description: |-
    At the end of {PlayerName}'s turn, all players gain {Level} |Firepower| if she's in |Passion|, or {Count} |Block| if she's in |Serenity|.
  Brief: |-
    At the end of your turn, all players gain {Level} |Firepower| in |Passion|, or {Count} |Block| in |Serenity|.

MpPartner:
  Name: Partner
  Description: Other players.
  Brief: Other players.

MpFrontalDefenseTalismanSe:
  Name: Frontal Defense Talisman
  Description: |-
    Whenever {PlayerName} gains |Barrier| from a card,
    all |Partners| gain half that much |Block|.
  Brief: |-
    |Barrier| gained from cards also gives all |Partners| half that much |Block|.

MpScaled:
  Name: Scaled
  Description: Costs more mana for each |Partner| present.
  Brief: Costs more mana for each |Partner| present.

MpCatalystSe:
  Name: Catalyst
  Description: |-
    Whenever {PlayerName} creates an |Unstable Potion|, add an |Unstable Potion| to a random |Partner|'s draw pile {Level:plural one='1 time' other='% times'}.
  Brief: |-
    Created Unstable Potions are also added to a random |Partner|'s draw pile, {Level:plural one='once' other='% times'}.

MpSharedTechniqueSe:
  Name: Shared Technique
  Description: |-
    The next {Level:plural one='attack card' other='% attack cards'} {PlayerName} plays this turn will also be played for all |Partners|.
  Brief: |-
    Your next {Level:plural one='attack card' other='% attack cards'} this turn will also be played for your |Partners|.

MpInspiredBondsSe:
  Name: Inspired Bonds
  Description: |-
    When a |Teammate|'s |a:Active Skill| or |u:Ultimate Skill| is used, a random |Teammate| in each |Partner|'s hand gains {Level} |Unity|.
  Brief: |-
    Teammate skills also give a random |Teammate| in each |Partner|'s hand {Level} |Unity|.
