# Note: "Partner" is as in "Partner" from Imperishable Night.
# This refers to other players in multiplayer.

MpDonateBlock:
  Name: Remote Boundary
  Description: |-
    Choose a |Partner|.
    They gain {Block} |Block|.
  UpgradedDescription: |-
    Choose a |Partner|.
    They gain {Block} |Block| {Value1} times.

MpAnatta:
  Name: Anatta
  Description: |-
    Whenever you exit |Serenity|,
    all players gain {Mana}.
    Enter |Serenity|.

MpWhim:
  Name: Whim
  Description: |-
    Choose a |Partner|.
    They play the top card of their draw pile.
  UpgradedDescription: |-
    Choose a |Partner|.
    They play the top {Value1} cards of their draw pile.

MpBorrowTechniques:
  Name: Borrow Techniques
  Description: |-
    Choose a |Partner|.
    Choose 1 of {Value1} random cards from their pool to add to the hand. It |temporarily costs| {Mana} and has |Exile| and |Ethereal|.

MpBladeSymphony:
  Name: Blade Symphony
  Description: |-
    Exile up to {Value1} |Throwing Knives| from the hand.
    Add that many |Throwing Knives| to each |Partner|'s hand.

MpOffering:
  Name: Offering to the Ownerless
  Description: |-
    The next Ability card you play is also played for all your |Partners|.
  FlavorText: |-
    What is given away freely is not, in fact, given at all. But losing gold would be sacrificing gameplay for lore.

MpEscapePlan:
  Name: Escape Plan
  Description: |-
    Choose a |Partner|.
    You both gain {Value1} |Graze|.

