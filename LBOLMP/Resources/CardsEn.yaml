# Note: "Partner" is as in "Partner" from Imperishable Night.
# This refers to other players in multiplayer.

MpDefibrillator:
  Name: Defibrillator
  Description: |-
    Revive all downed |Partners| with {Value1}% Life.
    They can't lose life for {Value2} turn.
    |Limited【{DeckCounter}】|

MpDonateBlock:
  Name: Remote Boundary
  Description: |-
    Choose a |Partner|.
    They gain {Block} |Block|.
  UpgradedDescription: |-
    Choose a |Partner|.
    They gain {Block} |Block| {Value1} times.

MpAnatta:
  Name: Anatta
  Description: |-
    Whenever {PlayerName} exits |Serenity|, all players gain {Mana}.
    Enter |Serenity|.

MpWhim:
  Name: Whim
  Description: |-
    Choose a |Partner|.
    They play the top {Value1} cards of their draw pile.
  UpgradedDescription: |-
    Choose a |Partner|.
    They play the top {Value1} cards of their draw pile.

MpBorrowTechniques:
  Name: Borrow Techniques
  Description: |-
    Choose a |Partner|.
    Choose 1 of {Value1} random cards from their pool to add to the hand. It |temporarily costs| {Mana} and has |Exile| and |Ethereal|.

MpBladeSymphony:
  Name: Blade Symphony
  Description: |-
    Exile up to {Value1} |Throwing Knives| from the hand.
    Add that many |Throwing Knives| with |Auto-Exile| to the top of each |Partner|'s draw pile.

MpOffering:
  Name: Offering to the Ownerless
  Description: |-
    The next {Value1:plural one='Ability card' other='% Ability cards'} you play will also be played for all your |Partners|.
  FlavorText: |-
    What is given away freely is not, in fact, given at all. But losing gold would be sacrificing gameplay for lore.

MpEscapePlan:
  Name: Escape Plan
  Description: |-
    Choose a |Partner|.
    You both gain {Value1} |Graze|.

MpFrontalDefenseTalisman:
  Name: Frontal Defense Talisman
  Description: |-
    Whenever you gain |Barrier| from a card,
    all |Partners| gain half that much |Block|.

MpRewind:
  Name: Rewind
  Description: |-
    Choose a |Partner|.
    Swap their draw pile and discard pile.
    They draw {Value1} cards.

MpIntrusiveThought:
  Name: Intrusive Thought
  Description: |-
    Choose a |Partner|.
    Discard 1 card from your hand.
    They play that card.
  DetailText: |-
    |Copies| and Tools cannot be targeted.
    If the targeted card is an Ability or has |Exile|, it becomes a |Copy|.

MpSelfControl:
  Name: Self-Fulfillment
  Description: |-
    Choose: Enter |Passion| or |Serenity|.
    At the end of {PlayerName}'s turn, all players gain {Value1} |Firepower| if she's in |Passion|, or {Value2} |Block| if she's in |Serenity|.
  ExtraDescription1: Enter |Passion|.
  ExtraDescription2: Enter |Serenity|.

MpIceBlock:
  Name: Ice Block
  Description: |-
    Choose any player. They can't lose life for one turn.
    They lose all |Block|, |Barrier| and |Graze|.
    They retain their hand this turn, and end their turn.

MpEntrust:
  Name: Entrust
  Description: |-
    Choose a |Partner|.
    Lose all |Firepower| and |Temporary Firepower|.
    They gain that much |Firepower| and |Temporary Firepower|.

MpYinYangDistribution:
  Name: Yin-Yang Distribution
  Description: |-
    Add a |Yin-Yang Orb| to each |Partner|'s hand.
  UpgradedDescription: |-
    Add a |Yin-Yang Orb+| to each |Partner|'s hand.

MpTimeDilation:
  Name: Time Dilation
  Description: |-
    Choose a |Partner|.
    They take an extra turn.
    End {PlayerName}'s turn.

MpDivergingTimePeek:
  Name: Diverging Time Peek
  Description: |-
    Choose a |Partner|.
    Add 1 card from their Exile pile into your hand. It |temporarily costs| {Mana} and has |Exile| and |Ethereal|.
  DetailText: |-
    |Copies| cannot be targeted.
    The card added to your hand becomes a |Copy|.
    If the card is an Ability or has |Exile|, their card becomes a |Copy| as well.

MpCleanse:
  Name: Cleanse
  Description: |-
    Remove all debuffs from all |Partners|.
    |Scaled| {Mana}
  UpgradedDescription: |-
    Remove all debuffs from all players.
    |Scaled| {Mana}

MpChemistryLesson:
  Name: Chemistry Lesson
  Description: |-
    For every |Unstable Potion| in the draw and discard pile, add an |Unstable Potion| to a random |Partner|'s draw pile.
  UpgradedDescription: |-
    Add an |Unstable Potion| to the draw pile.
    For every |Unstable Potion| in the draw and discard pile, add an |Unstable Potion| to a random |Partner|'s draw pile.
  FlavorText: |-
    Add the nitroglycerin last.
    If it starts fizzing, run.

MpCatalyst:
  Name: Catalyst
  Description: |-
    Whenever {PlayerName} creates an |Unstable Potion|, add an |Unstable Potion| to a random |Partner|'s draw pile.
  UpgradedDescription: |-
    Whenever {PlayerName} creates an |Unstable Potion|, add an |Unstable Potion| to a random |Partner|'s draw pile.
    Add 2 |Unstable Potions| to the draw pile.

MpOvercharge:
  Name: Overcharge
  Description: |-
    Gain {Value1} |Temporary Firepower|.
    |Overdrive| {Value2}: all |Partners| gain {Value1} Temporary Firepower.

MpWrenchToss:
  Name: Wrench Toss
  Description: |-
    Deal {Damage} damage.
    Increase this card's damage by {Value1} this combat, and add it to the top of a random |Partner|'s draw pile. Mana of any color can be spent to pay its cost.

MpAuraOfTranquility:
  Name: Aura of Tranquility
  Description: |-
    |For each <sprite="ManaSprite" name="2"> spent|: add a |Pure| to each |Partner|'s hand.
  UpgradedDescription: |-
    |For each <sprite="ManaSprite" name="2"> spent|: add a |Pure+| to each |Partner|'s hand.

MpCosmicInsight:
  Name: Cosmic Insight
  Description: |-
    Add an |Astrology| to each player's hand.
  UpgradedDescription: |-
    Add an |Astrology+| to each player's hand.

MpSharedTechnique:
  Name: Shared Technique
  Description: |-
    In this turn, the next {Value1:plural one='% attack card is' other='% attack cards are'} also played for all |Partners|.

MpBackUp:
  Name: Back Up
  Description: |-
    Choose a |Partner|.
    Exile a |Teammate| card in the hand. Add that card to their hand. It |temporarily costs| {Mana} and has |Exile| and |Ethereal|.

MpIceWall:
  Name: Ice Wall
  Description: |-
    All |Partners| gain |Frost Armor| equal to the current |Frost Armor|.
  UpgradedDescription: |-
    All |Partners| gain |Frost Armor| equal to the current |Frost Armor|.
    Gain |Block| equal to the current |Frost Armor|.

MpInspiredBonds:
  Name: Inspired Bonds
  Description: |-
    When a |Teammate|'s |a:Active Skill| or |u:Ultimate Skill| is used, a random |Teammate| in each |Partner|'s hand gains {Value1} |Unity|.
