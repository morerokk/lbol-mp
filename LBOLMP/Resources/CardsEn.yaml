# Note: "Partner" is as in "Partner" from Imperishable Night.
# This refers to other players in multiplayer.

MpDonateBlock:
  Name: Remote Boundary
  Description: |-
    Choose a |Partner|.
    They gain {Block} |Block|.
  UpgradedDescription: |-
    Choose a |Partner|.
    They gain {Block} |Block| {Value1} times.

MpAnatta:
  Name: Anatta
  Description: |-
    Whenever {PlayerName} exits |Serenity|,
    all players gain {Mana}.
    Enter |Serenity|.

MpWhim:
  Name: Whim
  Description: |-
    Choose a |Partner|.
    They play the top card of their draw pile.
  UpgradedDescription: |-
    Choose a |Partner|.
    They play the top {Value1} cards of their draw pile.

MpBorrowTechniques:
  Name: Borrow Techniques
  Description: |-
    Choose a |Partner|.
    Choose 1 of {Value1} random cards from their pool to add to the hand. It |temporarily costs| {Mana} and has |Exile| and |Ethereal|.

MpBladeSymphony:
  Name: Blade Symphony
  Description: |-
    Exile up to {Value1} |Throwing Knives| from the hand.
    Add that many |Throwing Knives| to each |Partner|'s hand.

MpOffering:
  Name: Offering to the Ownerless
  Description: |-
    The next {Value1:plural one='Ability card' other='% Ability cards'} you play will also be played for all your |Partners|.
  FlavorText: |-
    What is given away freely is not, in fact, given at all. But losing gold would be sacrificing gameplay for lore.

MpEscapePlan:
  Name: Escape Plan
  Description: |-
    Choose a |Partner|.
    You both gain {Value1} |Graze|.

MpFrontalDefenseTalisman:
  Name: Frontal Defense Talisman
  Description: |-
    Whenever you gain |Barrier| from a card,
    all |Partners| gain half that much |Block|.

MpRewind:
  Name: Rewind
  Description: |-
    Choose a |Partner|.
    Swap their draw pile and discard pile.
    They draw {Value1} cards.

MpIntrusiveThought:
  Name: Intrusive Thought
  Description: |-
    Choose a |Partner|.
    Discard 1 card from your hand.
    They play that card.
  DetailText: |-
    |Copies| and Tools cannot be targeted.
    If the targeted card is an Ability or has |Exile|, it becomes a |Copy|.

MpSelfControl:
  Name: Self-Fulfillment
  Description: |-
    Choose: Enter |Passion| or |Serenity|.
    At the end of {PlayerName}'s turn, all players gain {Value1} |Firepower| if she's in |Passion|, or {Value2} |Block| if she's in |Serenity|.
  ExtraDescription1: Enter |Passion|.
  ExtraDescription2: Enter |Serenity|.

MpIceBlock:
  Name: Ice Block
  Description: |-
    Choose any player. They can't lose life for one turn.
    They lose all |Block|, |Barrier| and |Graze|.
    They retain their hand this turn, and end their turn.

MpEntrust:
  Name: Entrust
  Description: |-
    Choose a |Partner|.
    Lose all |Firepower| and |Temporary Firepower|.
    They gain that much |Firepower| and |Temporary Firepower|.

MpYinYangDistribution:
  Name: Yin-Yang Distribution
  Description: |-
    Add a |Yin-Yang Orb| to each |Partner|'s hand.
  UpgradedDescription: |-
    Add a |Yin-Yang Orb+| to each |Partner|'s hand.

MpTimeDilation:
  Name: Time Dilation
  Description: |-
    Choose a |Partner|.
    They take an extra turn after their current turn.
    End {PlayerName}'s turn.

MpDivergingTimePeek:
  Name: Diverging Time Peek
  Description: |-
    Choose a |Partner|.
    Add 1 card from their Exile pile into your hand. It |temporarily costs| {Mana} and has |Exile| and |Ethereal|.
  DetailText: |-
    |Copies| cannot be targeted.
    The card added to your hand becomes a |Copy|.
    If the card is an Ability or has |Exile|, their card becomes a |Copy| as well.
