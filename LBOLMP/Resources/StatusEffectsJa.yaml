MpResilient:
  Name: 耐性
  Description: |-
    ターン終了時、|脱力|、|弱体| 、|ロックオン|を追加で{Level}減少させる。
    |火力低下|の減少量が{Level}少なくなる。(最低1)
  Brief: "|脱力|、|弱体|、|ロックオン|がより早く減少し、|火力低下|を受けにくくなる。"
  
MpOfferingSe:
  Name: 無主への供物
  Description: 次に使用する能力カード{Level}枚は、|仲間|全員の場でも使用される。
  Brief: 次の能力カード{Level}枚は|仲間|の場でも使用される。

MpAnattaSe:
  Name: 無我の境地
  Description: "|平静|状態を終了する度、すべてのプレイヤーは{Mana}を得る。"
  Brief: "|平静|状態を終了する度、すべてのプレイヤーは{Mana}を得る。"

MpAbilityPileSe:
  Name: 能力の山
  Description: 能力カードのコストが{Mana}増加する。
  Brief: 能力カードのコストが{Mana}増加する。

MpSelfControlSe:
  Name: エゴコントロール
  Description: |-
    プレイヤーのターン終了時、|熱情|状態ならすべてのプレイヤーは|火力|{Level}得る。
    |平静|状態なら、すべてのプレイヤーは|ブロック|{Count}得る。
  Brief: |-
    プレイヤーのターン終了時、|熱情|状態ならすべてのプレイヤーは|火力|{Level}得る。|平静|状態なら、すべてのプレイヤーは|ブロック|{Count}得る。

MpPartner:
  Name: 仲間
  Description: 他のプレイヤー。
  Brief: 他のプレイヤー。

MpFrontalDefenseTalismanSe:
  Name: 前方安全札
  Description: |-
    あなたがカードから|バリア|を得るとき、すべての|仲間|はその半分に等しい|ブロック|を得る。
  Brief: |-
    あなたがカードから|バリア|を得るとき、すべての|仲間|はその半分に等しい|ブロック|を得る。

MpScaled:
  Name: 代償
  Description: "|仲間|が1人いるごとに、必要なマナが増加する。"
  Brief: "|仲間|が1人いるごとに、必要なマナが増加する。"

MpCatalystSe:
  Name: 触媒
  Description: |-
    {PlayerName}が|ポーション|を生成するたび、ランダムな|仲間|の山札に|ポーション|を{Level}回追加する。
  Brief: |-
    生成した|ポーション|は、ランダムな|仲間|の山札にも追加される。

MpSharedTechniqueSe:
  Name: 連携技
  Description: |-
    このターン、{PlayerName}が次にプレイする{Level}枚の攻撃カードは、すべての|仲間|にもプレイされる。
  Brief: |-
    このターン、次にプレイする何枚かの攻撃カードは、|仲間|にもプレイされる。


MpInspiredBondsSe:
  Name: 絆の触発
  Description: |-
    |パートナー|の|a:起動スキル|または|u:奥義スキル|が使用されるたび、各|仲間|の手札にあるランダムな|パートナー|が|支援値|{Level}を得る。 

  Brief: |-
    |パートナー|のスキルは、各|仲間|の手札にあるランダムな|パートナー|にも|支援度|を与える。

MpDeepFreezeSe:
  Name: 極寒
  Description: |-
    {PlayerName}がすでに|冷気|を持つ敵に|冷気|を付与するたび、|弱体|{Level} を与える。
  Brief: |-
    敵の|冷気|を重ねると、|弱体|を与える。

MpIceShardsSe:
  Name: 氷の欠片
  Description: |-
    {PlayerName}が|冷気|を持つ敵に攻撃ダメージを与える度、その仲間は|フロストアーマー|{Level}を得る。
  Brief: |-
    |冷気|を持つ敵に攻撃ダメージを与える度、その仲間は|フロストアーマー|を得る。