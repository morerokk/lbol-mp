# Note: "Partner" is as in "Partner" from Imperishable Night.
# This refers to other players in multiplayer.

MpDefibrillator:
  Name: 蘇生装置
  Description: |-
    戦闘不能になったすべての|仲間|を、{Value1}%のライフで復活させる。
    {Value2}ターンの間、ライフを失わなくなる。
    |消耗品【{DeckCounter}】|


MpDonateBlock:
  Name: 遠隔結界
  Description: |-
    |仲間|を1人選択する。
    仲間は{Block}|ブロック|を得る。
  UpgradedDescription: |-
    |仲間|を1人選択する。
    仲間は{Block}|ブロック|を{Value1}回得る。


MpAnatta:
  Name: 無我の境地
  Description: |-
    {PlayerName}が|平静|状態を終了する度に、すべてのプレイヤーは{Mana}を得る。
    |平静|状態に入る。


MpWhim:
  Name: 気まぐれ
  Description: |-
    |仲間|を1人選択する。
    その仲間は山札の一番上から{Value1}枚のカードをプレイする。
  UpgradedDescription: |-
    |仲間|を1人選択する。
    その仲間は山札の一番上から{Value1}枚のカードをプレイする。

MpBorrowTechniques:
  Name: 他者の秘術
  Description: |-
    |仲間|を1人選択する。
    その仲間のカードプールのランダムな{Value1}枚のカードから1枚選び、手札に追加する。それは|臨時コスト|{Mana}で|廃棄|と|虚無|を持つ。


MpBladeSymphony:
  Name: ブレードシンフォニー
  Description: |-
    手札から|投げナイフ|を{Value1}枚まで廃棄する。
    すべての|仲間|の手札にその枚数に等しい|投げナイフ|を追加する。

MpOffering:
  Name: 無主への供物
  Description: |-
    次に使用する{Value1:plural one='能力カード' other='%枚の能力カード'}は、あなたの|仲間|全員も使用する。
  FlavorText: |-
    タダで与えたものは、真に与えたものではない。とはいえ、金まで失わせるのは、設定のためにゲーム性を犠牲にするというものだ。

MpEscapePlan:
  Name: 逃亡計画
  Description: |-
    |仲間|を1人選択する。
    あなたとその仲間は|グレイズ|{Value1}を得る。


MpFrontalDefenseTalisman:
  Name: 前方安全札
  Description: |-
    あなたがカードから|バリア|を得るとき、
    すべての|仲間|はその半分に等しい|ブロック|を得る。


MpRewind:
  Name: 時間逆行
  Description: |-
    |仲間|を1人選択する。
    その仲間の山札と捨て札を入れ替える。
    その仲間はカードを{Value1}枚引く。


MpIntrusiveThought:
  Name: 思考侵入
  Description: |-
    |仲間|を1人選択する。
    手札からカードを1枚捨てる。
    選択された仲間はそのカードをプレイする。
  DetailText: |-
    |複製|と道具は選択できない。
    能力または|廃棄|を持つカードが選択された時、それは|複製|になる。


MpSelfControl:
  Name: エゴコントロール
  Description: |-
    |チョイス|: |熱情|又は|平静|に入る。
    {PlayerName}のターン終了時、
    |熱情|状態であればすべてのプレイヤーは|火力|{Value1} を得る。
    |平静|状態であればすべてのプレイヤーは{Value2}|ブロック|を得る。
  ExtraDescription1: "|熱情|に入る。"
  ExtraDescription2: "|平静|に入る。"

MpIceBlock:
  Name: アイスブロック
  Description: |-
    任意のプレイヤーを選ぶ。その仲間は1ターンの間、ライフを失わない。
    その仲間の|ブロック|、|バリア|、|グレイズ|をすべて失わせる。
    このターン、その仲間の手札を保持し、そのターンを終了する。


MpEntrust:
  Name: エントラスト
  Description: |-
    |仲間|を選択する。
    |臨時火力|{Value1}を得る。すべての|火力|と|臨時火力|を失う。
    その仲間はそれに等しい|火力|と|臨時火力|を得る。


MpYinYangDistribution:
  Name: 陰陽玉分配
  Description: |-
    すべての|仲間|の手札に|陰陽玉|を1枚加える。
  UpgradedDescription: |-
    すべての|仲間|の手札に|陰陽玉+|を1枚加える。

MpTimeDilation:
  Name: 時間遅延
  Description: |-
    |仲間|を選択する。
    その仲間はターン終了時に追加ターンを得る。
    {PlayerName}のターンを終了する。

MpDivergingTimePeek:
  Name: 分岐世界の覗き見
  Description: |-
    |仲間|を選択する。
    その仲間の廃棄場からカードを1枚加える。それは|臨時コスト|{Mana}で|廃棄|と|虚無|を持つ。
  DetailText: |-
    |複製|は選択できない。
    あなたの手札に加えられるカードは|複製|となる。
    もしカードが能力又は|廃棄|を持つ場合、そのカードは|複製|となる。

MpCleanse:
  Name: 浄化
  Description: |-
    すべての|仲間|からデバフをすべて解除する。
    |代償|{Mana}
  UpgradedDescription: |-
    すべての|仲間|からデバフをすべて解除する。
    |代償|{Mana}

MpChemistryLesson:
  Name: 化学の授業
  Description: |-
    山札と捨て札にある|ポーション|1枚につき、ランダムな|仲間|の山札に|ポーション|を1枚加える。
  UpgradedDescription: |-
    山札に|ポーション|を1枚加える。
    山札と捨て札にある|ポーション|1枚につき、ランダムな|仲間|の山札に|ポーション|を1枚加える。
  FlavorText: |-
    最後にニトログリセリンを加えること。
    泡立ち始めたら、逃げろ。

MpCatalyst:
  Name: 触媒
  Description: |-
    {PlayerName}が|ポーション|を生成する度に、ランダムな|仲間|の山札に|ポーション|を1枚加える。
  UpgradedDescription: |-
    {PlayerName}が|ポーション|を生成する度に、ランダムな|仲間|の山札に|ポーション|を1枚加える。
    山札に|ポーション|を2枚加える。

MpOvercharge:
  Name: 過充電
  Description: |-
    |臨時火力|{Value1}を得る。
    |オーバードライブ|{Value2}：すべての|仲間|が|臨時火力|{Value1}を得る。

MpWrenchToss:
  Name: レンチ投げ
  Description: |-
    {Damage}ダメージを与える。
    この戦闘中、このカードのダメージを{Value1}増加させ、ランダムな|仲間|の山札の一番上にこのカードを加える。
    コストの支払いには任意の色のマナを使用できる。
  FlavorText: |-
    物理的な衝撃を受けると硬化する。

MpAuraOfTranquility:
  Name: 静穏のオーラ
  Description: |-
    |<sprite="ManaSprite" name="2">を1マナ消費するたび|：すべての|仲間|の手札に|純粋|を1枚加える。
  UpgradedDescription: |-
    |<sprite="ManaSprite" name="2">を1マナ消費するたび|：すべての|仲間|の手札に|純粋+|を1枚加える。

MpCosmicInsight:
  Name: 宇宙の叡智
  Description: |-
    すべての仲間の手札に|星占い|を1枚加える。
  UpgradedDescription: |-
    すべての仲間の手札に|星占い+|を1枚加える。

MpSharedTechnique:
  Name: 連携技
  Description: |-
    このターン、次の{Value1}枚の攻撃カードは、すべての|仲間|にもプレイされる。


MpBackUp:
  Name: 援護
  Description: |-
    |仲間|を1人選ぶ。
    手札から|パートナー|カードを1枚選ぶ。そのカードを相手の手札に加える。
    そのカードは|臨時コスト|が{Mana}になり、|虚無|を持つ。


MpIceWall:
  Name: 氷壁
  Description: |-
    すべての|仲間|は、現在の|フロストアーマー|と同じ値の|フロストアーマー|を得る。
  UpgradedDescription: |-
    すべての|仲間|は、現在の|フロストアーマー|と同じ値の|フロストアーマー|を得る。
    |フロストアーマー|の値に等しい|ブロック|を得る。

MpInspiredBonds:
  Name: 絆の触発
  Description: |-
    |パートナー|の|a:起動スキル|または|u:奥義スキル|が使用されるたび、各|仲間|の手札にあるランダムな|パートナー|が|支援度|{Value1}を得る。 各|仲間|の手札にランダムな|e:光の妖精|を1枚加える。そのカードは|一時的にコスト|が{Mana}になり、|虚無|を持つ。

MpDeepFreeze:
  Name: 極寒
  Description: |-
    {PlayerName}がすでに|冷気|を持つ敵に|冷気|を付与するたび、|弱体|{Value1}を与える。
  UpgradedDescription: |-
    {PlayerName}がすでに|冷気|を持つ敵に|冷気|を付与するたび、|弱体|{Value1}を与える。
    敵全体に|冷気|を与える。


MpIceShards:
  Name: 氷の欠片
  Description: |-
    いずれかの仲間が|冷気|を持つ敵に攻撃ダメージを与えるたび、その仲間は|フロストアーマー|{Value1}を得る。
