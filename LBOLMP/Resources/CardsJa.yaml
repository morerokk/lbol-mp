# Note: "Partner" is as in "Partner" from Imperishable Night.
# This refers to other players in multiplayer.

MpDonateBlock:
  Name: 遠隔結界
  Description: |-
    |仲間|を1人選択する。
    仲間は{Block}|ブロック|を得る。
  UpgradedDescription: |-
    |仲間|を1人選択する。
    仲間は{Block}|ブロック|を{Value1}回得る。


MpAnatta:
  Name: 無我の境地
  Description: |-
    {PlayerName}が|平静|状態を終了する度に、すべてのプレイヤーは{Mana}を得る。
    |平静|状態に入る。


MpWhim:
  Name: 気まぐれ
  Description: |-
    |仲間|を1人選択する。
    そのプレイヤーは山札のいちばん上のカードをプレイする。
  UpgradedDescription: |-
    |仲間|を1人選択する。
    そのプレイヤーは山札のいちばん上から{Value1}枚のカードをプレイする。

MpBorrowTechniques:
  Name: 他者の秘術
  Description: |-
    |仲間|を1人選択する。
    そのプレイヤーのカードプールのランダムな{Value1}枚のカードから1枚選び、手札に追加する。それは|臨時コスト|{Mana}で|廃棄|と|虚無|を持つ。


MpBladeSymphony:
  Name: ブレードシンフォニー
  Description: |-
    手札から|投げナイフ|を{Value1}枚まで廃棄する。
    すべての|仲間|の手札にその枚数に等しい|投げナイフ|を追加する。

MpOffering:
  Name: 無主への供物
  Description: |-
    次に使用する{Value1:plural one='能力カード' other='% 能力カード'}は、あなたの|仲間|全員も使用する。
  FlavorText: |-
    タダで与えたものは、真に与えたものではない。とはいえ、金まで失わせるのは、設定のためにゲーム性を犠牲にするというものだ。

MpEscapePlan:
  Name: 逃亡計画
  Description: |-
    |仲間|を1人選択する。
    あなたとその仲間は|グレイズ|{Value1}を得る。


MpFrontalDefenseTalisman:
  Name: 前方安全札
  Description: |-
    あなたがカードから|バリア|を得るとき、
    すべての|仲間|はその半分に等しい|ブロック|を得る。


MpRewind:
  Name: 時間逆行
  Description: |-
    |仲間|を1人選択する。
    その仲間の山札と捨て札を入れ替える。
    その仲間はカードを{Value1}枚引く。


MpIntrusiveThought:
  Name: 侵入思考
  Description: |-
    |仲間|を1人選択する。
    手札からカードを１枚捨てる。
    選択された仲間はそのカードをプレイする。
  DetailText: |-
    |複製|と道具は選択できない。
    能力または|廃棄|を持つカードが選択された時、それは|複製|になる。


MpSelfControl:
  Name: エゴコントロール
  Description: |-
    選択: |熱情|又は|平静|に入る。
    {PlayerName}のターン終了時、
    |熱情|状態であればすべてのプレイヤーは|火力|{Value1} を得る。
    |平静|状態であればすべてのプレイヤーは{Value2}|ブロック|を得る。
  ExtraDescription1: '|熱情|に入る。'
  ExtraDescription2: '|平静|に入る。'

MpIceBlock:
  Name: アイスブロック
  Description: |-
    任意のプレイヤーを選ぶ。そのプレイヤーは1ターンの間、ライフを失わない。
    そのプレイヤーの|ブロック|、|バリア|、|グレイズ|をすべて失わせる。
    このターン、そのプレイヤーの手札を保持し、そのターンを終了する。


MpEntrust:
  Name: エントラスト
  Description: |-
    |仲間|を選択する。
    すべての|火力|と|臨時火力|を失う。
    そのプレイヤーはそれに等しい|火力|と|臨時火力|を得る。


MpYinYangDistribution:
  Name: 陰陽玉分配
  Description: |-
    すべての|仲間|の手札に|陰陽玉|を1枚加える。
  UpgradedDescription: |-
    すべての|仲間|の手札に|陰陽玉+|を1枚加える。

MpTimeDilation:
  Name: 時間遅延
  Description: |-
    |仲間|を選択する。
    その仲間はターン終了時に追加ターンを得る。
    {PlayerName}のターンを終了する。

MpDivergingTimePeek:
  Name: 分岐世界の覗き見
  Description: |-
    |仲間|を選択する。
    そのプレイヤーの廃棄場からカードを1枚加える。それは|臨時コスト|{Mana}で|廃棄|と|虚無|を持つ。
  DetailText: |-
    |複製|は選択できない。
    あなたの手札に加えられるカードは|複製|となる。
    もしカードが能力又は|廃棄|を持つ場合、そのカードは|複製|となる。

