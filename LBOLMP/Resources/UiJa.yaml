# LBOL MP interface text, Ja.
#
# One entry per key. Keys must match the MpText enum in Localization/MpText.cs and are
# never translated; only the text to the right of the colon is.
#
# {0}, {1} and so on are placeholders the mod fills in at runtime. Keep them, and keep
# their numbers, but they may be reordered to suit the language.
#
# A missing or blank entry falls back to English rather than breaking, so a partial
# translation is fine to ship.

