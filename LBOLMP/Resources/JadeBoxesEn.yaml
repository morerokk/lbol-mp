# Note: "Partner" is as in "Partner" from Imperishable Night.
# This refers to other players in multiplayer.

MpShareTheWealth:
  Name: Share the Wealth
  Description: |-
    Whenever any player gains or loses <sprite="Point" name="Gold">, everyone else also gains or loses that much <sprite="Point" name="Gold">.

MpAbilityPile:
  Name: Ability Pile
  Description: |-
    The first Ability card you play each combat is also played for all your |Partners|.
    Whenever you play an Ability card after that, all Ability cards cost {Mana} more.
